name: Task 5 - Self-Hosted Runner with Label

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  labeled-runner-job:
    name: Run on Labeled Self-Hosted Runner
    runs-on: [self-hosted, my-linux-runner]

    steps:
      - name: Confirm Runner Label Picked Up the Job
        run: |
          echo "=========================================="
          echo "  ✅ Job picked up by labeled runner!"
          echo "  Label Used  : my-linux-runner"
          echo "  Hostname    : $(hostname)"
          echo "  User        : $(whoami)"
          echo "  Date        : $(date)"
          echo "=========================================="

      - name: Show Runner Details
        run: |
          echo ""
          echo "🏷️  This runner has the label: my-linux-runner"
          echo "📌 Only runners with this label will pick up this job."
          echo ""
          echo "System Info:"
          uname -a